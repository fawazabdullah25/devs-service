spring:
  datasource:
    url: jdbc:h2:mem:devs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

devs:
  security:
    jwt-enabled: false
    allow-insecure-admin: false
  r2:
    enabled: false
  mux:
    enabled: false
