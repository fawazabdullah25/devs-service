apiVersion: apps/v1
kind: Deployment
metadata:
  name: devs-frontend
  labels:
    app.kubernetes.io/name: devs-frontend
    app.kubernetes.io/part-of: kstacks-devs
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devs-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devs-frontend
        app.kubernetes.io/part-of: kstacks-devs
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/kstacks-org/devs-frontend
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /en
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /en
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devs-frontend
  labels:
    app.kubernetes.io/name: devs-frontend
    app.kubernetes.io/part-of: kstacks-devs
spec:
  selector:
    app.kubernetes.io/name: devs-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
